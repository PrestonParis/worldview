name: GA results daily

# After election night: one full load a day until every Nov 3 and Dec 1
# contest is official (provisional ballots, cures, county and state
# certification), then the morning CSV snapshot. Scheduled runs only act in
# 2026; dispatch by hand for any other election.
on:
  schedule:
    - cron: "0 13 4-30 11 *"
    - cron: "0 13 1-15 12 *"
  workflow_dispatch:
    inputs:
      election:
        description: "SOS election id"
        required: true

concurrency:
  group: ga-results-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Election window
        id: window
        run: echo "active=$([ "$(date -u +%Y)" = 2026 ] || [ "${{ github.event_name }}" = workflow_dispatch ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.window.outputs.active == 'true'

      - uses: actions/setup-node@v4
        if: steps.window.outputs.active == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.window.outputs.active == 'true'

      - name: Write .env.local
        if: steps.window.outputs.active == 'true'
        run: |
          {
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            echo "NEON_DATABASE_URL=${{ secrets.NEON_DATABASE_URL }}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            echo "ALERT_WEBHOOK_URL=${{ secrets.ALERT_WEBHOOK_URL }}"
            echo "SITE_URL=${{ secrets.SITE_URL }}"
            echo "REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}"
          } > .env.local

      - name: Load unofficial elections
        if: steps.window.outputs.active == 'true'
        env:
          ELECTION: ${{ inputs.election }}
        run: |
          if [ -n "$ELECTION" ]; then ids="$ELECTION"; else
            ids=$(node -e '
              const { Client } = require("pg"); process.loadEnvFile(".env.local");
              const c = new Client({ connectionString: process.env.DATABASE_URL });
              c.connect()
                .then(() => c.query("select source_election_id from tracked_ingest_status where not is_official and election_date >= current_date - 60"))
                .then((r) => { console.log(r.rows.map((x) => x.source_election_id).join(" ")); return c.end(); })
                .catch((err) => { console.error(err.message); process.exit(1); });')
          fi
          for id in $ids; do
            npm run sync:ga-results -- --election="$id"
            npm run sync:ga-results -- --election="$id" --snapshot
          done
