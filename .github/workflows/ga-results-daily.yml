name: GA results daily

# After election night: one full load a day for every unofficial tracked
# election and every scheduled election past its day
# (data/elections/ga/schedule.json), through provisional ballots, cures and
# certification, then the morning CSV snapshot. An election that turns
# official is reconciled against the SOS media export once. One failing
# election doesn't stop the others; any failure posts an alert.
on:
  schedule:
    - cron: "0 13 4-30 11 *"
    - cron: "0 13 1-20 12 *"
  workflow_dispatch:
    inputs:
      election:
        description: "SOS election id (blank: every election due)"
        required: false

concurrency:
  group: ga-results-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Write .env.local
        run: |
          {
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            echo "NEON_DATABASE_URL=${{ secrets.NEON_DATABASE_URL }}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            echo "ALERT_WEBHOOK_URL=${{ secrets.ALERT_WEBHOOK_URL }}"
            echo "SITE_URL=${{ secrets.SITE_URL }}"
            echo "REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}"
          } > .env.local

      - name: Load elections due
        env:
          ELECTION: ${{ inputs.election }}
        run: |
          if [ -n "$ELECTION" ]; then due="$ELECTION - -"; else due=$(node scripts/ga-results-schedule.mjs --daily); fi
          echo "$due"
          failed=0
          while read -r id date kind; do
            [ -n "$id" ] || continue
            opts=()
            [ "$date" != - ] && opts+=(--date="$date")
            [ "$kind" != - ] && opts+=(--kind="$kind")
            npm run sync:ga-results -- --election="$id" "${opts[@]}" --reconcile-when-official || failed=1
            npm run sync:ga-results -- --election="$id" "${opts[@]}" --snapshot || failed=1
          done <<< "$due"
          exit $failed

      - name: Alert on failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          node -e 'import("./scripts/lib/alerts.mjs").then((m) => m.sendWebhook("⚠️ GA results daily load had a failure; the next daily run retries: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"))'
