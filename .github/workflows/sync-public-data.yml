name: Sync public data

# Weekly refresh of the bulk public datasets: the member crosswalk +
# committees (congress-legislators), state officials (Open States), Voteview
# ideology, Federal Register documents, CBP encounters, ICE detention, the
# DHS immigration yearbook, Census population estimates, FEC independent
# expenditures, FBI crime (state, city, hate crime, arrests), CDC violent
# deaths, the NCVS, FRED economy/housing/energy series, CDC overdoses, Gallup
# gun polling, and energy/temperature data. Every importer is idempotent; Federal
# Register is incremental. Slow one-off loads (SCDB, EAVS, USAspending
# history, ACS) are run by hand: `ENV_FILE=.env.cloud npm run import:all`.
on:
  schedule:
    - cron: "0 10 * * 1" # Mondays 10:00 UTC (after sync-legislation / sync-money)
  workflow_dispatch:

concurrency:
  group: sync-public-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Write .env.local
        run: |
          {
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            echo "NEON_DATABASE_URL=${{ secrets.NEON_DATABASE_URL }}"
            echo "NEO4J_URI=${{ secrets.NEO4J_URI }}"
            echo "NEO4J_USER=${{ secrets.NEO4J_USER }}"
            echo "NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}"
            echo "FEC_API_KEY=${{ secrets.FEC_API_KEY }}"
            echo "CENSUS_API_KEY=${{ secrets.CENSUS_API_KEY }}"
          } > .env.local

      - run: npm run backfill:members -- --congresses=95-119
      - run: npm run import:committees
      - run: npm run import:openstates
      - run: npm run import:voteview
      - run: npm run import:federal-register
      - run: npm run import:cbp
        continue-on-error: true # cbp.gov occasionally blocks CI runners
      - run: npm run import:ice-detention
        continue-on-error: true
      - run: npm run import:dhs-yearbook
      - run: npm run import:census-pep
      - run: npm run import:state-migration
      - run: npm run import:fec-ie
      - run: npm run import:fbi-crime -- --from=2024
      - run: npm run import:fbi-annual -- --from=2024
      - run: npm run import:fbi-cities -- --from=2024
      - run: npm run import:cdc-violent-deaths
      - run: npm run import:ncvs
      - run: npm run import:abortion
      - run: npm run import:religion -- --only=gallup
      - run: npm run import:fertility
      - run: npm run import:federal-budget
      - run: npm run import:fred
      - run: npm run import:health
      - run: npm run import:guns -- --only=gallup
      - run: npm run import:climate
