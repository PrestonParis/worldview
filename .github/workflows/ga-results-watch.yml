name: GA results watch

# Election-night ingest for Writ's close-races report (docs/elections/ga-close-races-runbook.md).
# Starts itself at 4:17 pm ET on each election day in
# data/elections/ga/schedule.json (Nov 3 general, Dec 1 runoff). Each run
# polls the Georgia SOS results feed for up to 5h45m, then starts the next
# run — even after a failure — until results are official or the schedule's
# stopAfter date passes. The watchdog (ga-results-health.yml) restarts the
# chain if it breaks anyway. A laptop can run the same command alongside;
# the ingest is idempotent.
on:
  schedule:
    - cron: "17 20 3 11 *"
    - cron: "17 20 1 12 *"
  workflow_dispatch:
    inputs:
      election:
        description: "SOS election id, or auto (finds it by date and kind)"
        default: auto
      date:
        description: "Election date (YYYY-MM-DD)"
        default: "2026-11-03"
      kind:
        description: "general, runoff, special, primary (for auto)"
        default: ""
      every:
        description: "Seconds between polls"
        default: "180"
      until:
        description: "Run length before handing off"
        default: 5h45m
      chain:
        description: "Start another run when this one ends and results are still unofficial"
        type: boolean
        default: true

concurrency:
  group: ga-results-watch
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  # Scheduled runs take the election from schedule.json for today's date;
  # a date with no entry (any other year) does nothing.
  plan:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.plan.outputs.active }}
      election: ${{ steps.plan.outputs.election }}
      date: ${{ steps.plan.outputs.date }}
      kind: ${{ steps.plan.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_ELECTION: ${{ inputs.election }}
          IN_DATE: ${{ inputs.date }}
          IN_KIND: ${{ inputs.kind }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            { echo "active=true"; echo "election=${IN_ELECTION:-auto}"; echo "date=$IN_DATE"; echo "kind=$IN_KIND"; } >> "$GITHUB_OUTPUT"
          else
            node scripts/ga-results-schedule.mjs --for-date="$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  watch:
    needs: plan
    if: needs.plan.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      ELECTION: ${{ needs.plan.outputs.election }}
      DATE: ${{ needs.plan.outputs.date }}
      KIND: ${{ needs.plan.outputs.kind }}
      EVERY: ${{ inputs.every || '180' }}
      UNTIL: ${{ inputs.until || '5h45m' }}
      CHAIN: ${{ github.event_name == 'schedule' || inputs.chain }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Write .env.local
        run: |
          {
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            echo "NEON_DATABASE_URL=${{ secrets.NEON_DATABASE_URL }}"
            echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
            echo "ALERT_WEBHOOK_URL=${{ secrets.ALERT_WEBHOOK_URL }}"
            echo "SITE_URL=${{ secrets.SITE_URL }}"
            echo "REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}"
          } > .env.local

      # Its own timeout, shorter than the job's, so a stuck run still
      # reaches the hand-off below.
      - name: Watch
        timeout-minutes: 350
        run: npm run sync:ga-results -- --election="$ELECTION" --date="$DATE" ${KIND:+--kind="$KIND"} --watch --every="$EVERY" --until="$UNTIL"

      # Runs after a failed or timed-out watch too; only a cancelled run
      # (someone stopping it on purpose) ends the chain here.
      - name: Hand off to the next run
        if: ${{ !cancelled() && env.CHAIN == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(node scripts/ga-results-schedule.mjs --handoff --date="$DATE")
          echo "Hand-off for $DATE: $state"
          if [ "$state" = continue ]; then
            gh workflow run ga-results-watch.yml --ref "${{ github.ref_name }}" \
              -f election="$ELECTION" -f date="$DATE" -f kind="$KIND" -f every="$EVERY" -f until="$UNTIL" -f chain=true
          fi

      - name: Alert on failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          node -e 'import("./scripts/lib/alerts.mjs").then((m) => m.sendWebhook("⚠️ GA results watch run failed (the next run or the watchdog picks it up): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"))'
