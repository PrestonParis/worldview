name: Sync Neo4j graph

# Rebuilds the Neo4j copy of the People & Power graph from Postgres
# (scripts/sync-graph.mjs), so editor changes and importer runs reach it
# within a day. Running daily also keeps Aura Free from auto-pausing, which
# it does after 3 days of inactivity.
on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:

concurrency:
  group: sync-graph
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Write .env.local
        run: |
          {
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            echo "NEO4J_URI=${{ secrets.NEO4J_URI }}"
            echo "NEO4J_USER=${{ secrets.NEO4J_USER }}"
            echo "NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}"
          } > .env.local

      - run: node scripts/sync-graph.mjs
