name: Keep Neo4j Aura awake

# Aura Free auto-pauses an instance after 3 days of inactivity (and it can
# be deleted after a further stretch paused). sync-legislation/sync-money
# only run weekly, which isn't often enough to prevent that on their own —
# this pings daily, well inside the 3-day window. Read-only.
on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch:

concurrency:
  group: keepalive-neo4j
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm install --no-save neo4j-driver

      - name: Write .env.local
        run: |
          {
            echo "NEO4J_URI=${{ secrets.NEO4J_URI }}"
            echo "NEO4J_USER=${{ secrets.NEO4J_USER }}"
            echo "NEO4J_PASSWORD=${{ secrets.NEO4J_PASSWORD }}"
          } > .env.local

      - run: node scripts/neo4j-keepalive.mjs
