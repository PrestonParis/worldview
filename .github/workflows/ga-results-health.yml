name: GA results health

# Watchdog for the election-night worker: every 10 minutes, posts to the
# alert webhook when a tracked election that isn't official yet has a stale
# heartbeat (the worker died or stopped). Scheduled runs only act during the
# 2026 window (Nov 3 – Dec 15); move the year for the next cycle.
on:
  schedule:
    - cron: "*/10 * 3-30 11 *"
    - cron: "*/10 * 1-15 12 *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Election window
        id: window
        run: echo "active=$([ "$(date -u +%Y)" = 2026 ] || [ "${{ github.event_name }}" = workflow_dispatch ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.window.outputs.active == 'true'
      - uses: actions/setup-node@v4
        if: steps.window.outputs.active == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.window.outputs.active == 'true'
      - name: Write .env.local
        if: steps.window.outputs.active == 'true'
        run: |
          {
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            echo "ALERT_WEBHOOK_URL=${{ secrets.ALERT_WEBHOOK_URL }}"
          } > .env.local
      - run: node scripts/ga-results-health.mjs
        if: steps.window.outputs.active == 'true'
