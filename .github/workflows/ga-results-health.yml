name: GA results health

# Watchdog for the election-night worker (scripts/ga-results-health.mjs):
# every 10 minutes during the windows in data/elections/ga/schedule.json, it
# restarts the watch workflow when no worker is alive and no watch run is
# queued or running, and alerts on any other tracked election whose worker
# died. Outside a scheduled window the script finds nothing to do.
#
# Dispatched with loop=true it is the sentinel: GitHub's cron is too sparse to
# protect election night, so the run repeats the check every 5 minutes, sends
# the progress digest, and hands off to its next run. The watch restarts it if
# it's missing, and it restarts the watch, so each chain guards the other.
on:
  schedule:
    - cron: "*/10 * 3-30 11 *"
    - cron: "*/10 * 1-31 12 *"
  workflow_dispatch:
    inputs:
      loop:
        description: "Run as the sentinel: repeat the check and hand off"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: ga-results-health-${{ inputs.loop && 'sentinel' || 'cron' }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.loop && 358 || 10 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Write .env.local
        run: |
          {
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            echo "ALERT_WEBHOOK_URL=${{ secrets.ALERT_WEBHOOK_URL }}"
            echo "SITE_URL=${{ secrets.SITE_URL }}"
          } > .env.local
      - name: Check
        timeout-minutes: ${{ inputs.loop && 350 || 8 }}
        run: node scripts/ga-results-health.mjs ${{ inputs.loop && '--loop --every=300 --until=5h45m' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      # Runs after a failed or timed-out pass too; only a deliberate cancel
      # ends the chain here, and then the watch's next run restarts it.
      - name: Hand off to the next sentinel run
        if: ${{ !cancelled() && inputs.loop }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(node scripts/ga-results-schedule.mjs --sentinel)
          echo "Sentinel still needed: $state"
          if [ "$state" = yes ]; then
            gh workflow run ga-results-health.yml --ref "${{ github.ref_name }}" -f loop=true
          fi
