name: GA results health

# Watchdog for the election-night worker (scripts/ga-results-health.mjs):
# every 10 minutes during the windows in data/elections/ga/schedule.json, it
# restarts the watch workflow when no worker is alive and no watch run is
# queued or running, and alerts on any other tracked election whose worker
# died. Outside a scheduled window the script finds nothing to do.
on:
  schedule:
    - cron: "*/10 * 3-30 11 *"
    - cron: "*/10 * 1-20 12 *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ga-results-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Write .env.local
        run: |
          {
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}"
            echo "ALERT_WEBHOOK_URL=${{ secrets.ALERT_WEBHOOK_URL }}"
          } > .env.local
      - run: node scripts/ga-results-health.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
