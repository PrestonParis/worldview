<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="writ-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#450a0a" />
    </linearGradient>
    <linearGradient id="writ-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="writ-parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef2f2" />
    </linearGradient>
    <filter id="writ-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7f1d1d" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#writ-bg)" filter="url(#writ-glow)" />

  <!-- Classical Column Capitols / Architectural Arch -->
  <path d="M30 32 H90 V36 H30 Z" fill="url(#writ-gold)" />
  <rect x="33" y="36" width="6" height="52" rx="1.5" fill="#fca5a5" opacity="0.4" />
  <rect x="81" y="36" width="6" height="52" rx="1.5" fill="#fca5a5" opacity="0.4" />

  <!-- Formal Parchment Scroll -->
  <path d="M42 30 C42 26 46 24 50 24 H78 C82 24 86 28 86 32 V78 C86 82 82 86 78 86 H48 C44 86 42 82 42 78 Z" fill="url(#writ-parchment)" />
  
  <!-- Inscribed Text Lines on Scroll -->
  <line x1="50" y1="36" x2="78" y2="36" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="44" x2="74" y2="44" stroke="#991b1b" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <line x1="50" y1="52" x2="78" y2="52" stroke="#991b1b" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <line x1="50" y1="60" x2="70" y2="60" stroke="#991b1b" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Gavel / Balanced Scaled Motif -->
  <path d="M60 20 L52 28 H68 Z" fill="url(#writ-gold)" />

  <!-- Official Wax Seal Stamp at Bottom Right -->
  <circle cx="74" cy="74" r="13" fill="url(#writ-gold)" />
  <circle cx="74" cy="74" r="10" fill="#991b1b" />
  <!-- Seal monogram / check -->
  <path d="M70 74 L73 77 L79 71" stroke="url(#writ-gold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Seal Ribbon Tails -->
  <path d="M71 84 L67 94 L73 92 L77 95 L75 84" fill="url(#writ-gold)" />
</svg>
