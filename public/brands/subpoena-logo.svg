<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="subpoena-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="subpoena-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="subpoena-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="subpoena-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4338ca" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Shield Rounded Rect -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#subpoena-bg)" filter="url(#subpoena-glow)" />

  <!-- Outer Investigative Reticle Ring -->
  <circle cx="60" cy="60" r="38" fill="none" stroke="url(#subpoena-accent)" stroke-width="2" stroke-dasharray="3 4" opacity="0.6" />

  <!-- Hexagonal Power Core -->
  <polygon points="60,28 86,43 86,77 60,92 34,77 34,43" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round" />

  <!-- Inner Document Seal -->
  <path d="M47 42 H73 V78 H47 Z" fill="#ffffff" fill-opacity="0.12" rx="4" />
  
  <!-- Flow Lines (Money & Power Ties) -->
  <line x1="47" y1="50" x2="67" y2="50" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="47" y1="58" x2="73" y2="58" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  <line x1="47" y1="66" x2="63" y2="66" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

  <!-- Investigative Loupe / Seal Focal Point -->
  <circle cx="68" cy="68" r="14" fill="url(#subpoena-bg)" stroke="url(#subpoena-gold)" stroke-width="3" />
  <line x1="78" y1="78" x2="90" y2="90" stroke="url(#subpoena-gold)" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="68" cy="68" r="5" fill="#fef3c7" />
</svg>
