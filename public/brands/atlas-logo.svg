<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="atlas-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
    <linearGradient id="atlas-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="atlas-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="atlas-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="atlas-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#312e81" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="10" y="10" width="100" height="100" rx="28" fill="url(#atlas-bg)" filter="url(#atlas-glow)" />

  <!-- Ideological 4-Quadrant Crosshairs -->
  <line x1="20" y1="60" x2="100" y2="60" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
  <line x1="60" y1="20" x2="60" y2="100" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Concentric Precision Ring Radii -->
  <circle cx="60" cy="60" r="36" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.3" />
  <circle cx="60" cy="60" r="24" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.4" />

  <!-- 8-Point Ideological Compass Star -->
  <!-- Diagonal Points -->
  <polygon points="60,60 72,48 60,38 48,48" fill="url(#atlas-cyan)" opacity="0.8" />
  <polygon points="60,60 72,72 60,82 48,72" fill="url(#atlas-cyan)" opacity="0.8" />
  <polygon points="60,60 48,72 38,60 48,48" fill="url(#atlas-cyan)" opacity="0.8" />
  <polygon points="60,60 72,48 82,60 72,72" fill="url(#atlas-cyan)" opacity="0.8" />

  <!-- Primary Cardinal Points (North, South, East, West) -->
  <!-- North (Up) -->
  <polygon points="60,22 66,54 60,60 54,54" fill="url(#atlas-rose)" />
  <!-- South (Down) -->
  <polygon points="60,98 66,66 60,60 54,66" fill="#be123c" />
  <!-- East (Right) -->
  <polygon points="98,60 66,66 60,60 66,54" fill="url(#atlas-rose)" />
  <!-- West (Left) -->
  <polygon points="22,60 54,66 60,60 54,54" fill="#be123c" />

  <!-- Central Coordinate Beacon -->
  <circle cx="60" cy="60" r="6" fill="url(#atlas-gold)" stroke="#ffffff" stroke-width="2" />
  <circle cx="60" cy="60" r="2" fill="#78350f" />
</svg>
