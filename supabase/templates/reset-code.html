<!-- Password reset code (Supabase "Reset Password" template; sendResetCodeAction). -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;">
        <tr>
          <td style="padding:28px 32px 0;">
            <table role="presentation" cellpadding="0" cellspacing="0">
              <tr>
                <td style="vertical-align:middle;padding-right:10px;">
                  <img src="https://worldviewpolitics.com/worldview-mark-red.png" width="32" height="32" alt="" style="display:block;border-radius:16px;" />
                </td>
                <td style="vertical-align:middle;font-size:17px;font-weight:700;color:#0f172a;letter-spacing:-0.2px;">Worldview</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 0;">
            <p style="margin:0 0 8px;font-size:20px;font-weight:600;color:#0f172a;">Reset your password</p>
            <p style="margin:0;font-size:14px;line-height:22px;color:#475569;">Enter this code on the Worldview reset page, then choose a new password.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px 0;">
            <div style="background:#f1f5f9;border-left:3px solid #dc2626;border-radius:8px;padding:16px 20px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:30px;font-weight:700;letter-spacing:6px;color:#0f172a;">{{ .Token }}</div>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px 28px;">
            <p style="margin:0;font-size:13px;line-height:20px;color:#64748b;">The code expires in 1 hour. If you didn't ask to reset your password, ignore this email. Your password stays the same.</p>
          </td>
        </tr>
      </table>
      <p style="margin:16px 0 0;font-size:12px;color:#94a3b8;">worldviewpolitics.com</p>
    </td>
  </tr>
</table>
